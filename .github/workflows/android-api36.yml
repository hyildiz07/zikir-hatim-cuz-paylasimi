name: Android API 36 AAB

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-api36.yml'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.1.0'
      - name: Generate Trusted Web Activity project
        run: |
          npm install --global @bubblewrap/cli@1.25.0
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cd android
          bubblewrap update --skipVersionUpgrade
      - name: Build unsigned release bundle
        working-directory: android
        run: bash ./gradlew :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: zikirmatik-api36-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab

